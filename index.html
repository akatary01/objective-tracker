<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objective Tracker</title>
    <link rel="stylesheet" href="/assets/css/vars.css" />
    <link rel="stylesheet" href="/assets/css/utils.css" />
    <link rel="stylesheet" href="/assets/css/app.css" />
    <script type="module" src="/src/main.js"></script>
</head>
<body>
<div id="root" x-data>
    <nav class="titlebar flex align-center justify-between no-select">
        <div class="titlebar-actions">
            <button
                class="new-section-btn"
                @click="$store.tracker.addFromToolbar()"
                :aria-label="$store.tracker.viewMode === 'sections' ? 'Add section' : ($store.tracker.canAddDayTask() ? 'Add task for selected day' : 'Choose a section before adding a task')"
                :title="$store.tracker.viewMode === 'sections' ? 'Add section' : ($store.tracker.canAddDayTask() ? 'Add task for selected day' : 'Choose a section before adding a task')"
            >+</button>
            <button class="theme-btn" @click="window.objectiveTracker?.cycleTheme?.()" title="Change color theme" aria-label="Change color theme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3a9 9 0 1 0 0 18h1.2a1.8 1.8 0 0 0 1.3-3.1 1.8 1.8 0 0 1 1.3-3.1H18a3 3 0 0 0 3-3c0-4.9-4-8.8-9-8.8Z" />
                    <circle cx="7.5" cy="10" r="1" />
                    <circle cx="11" cy="6.5" r="1" />
                    <circle cx="16" cy="8" r="1" />
                </svg>
            </button>
            <button
                class="view-mode-btn"
                @click="$store.tracker.toggleView()"
                :aria-label="$store.tracker.viewMode === 'sections' ? 'Switch to day view' : 'Switch to section view'"
                :title="$store.tracker.viewMode === 'sections' ? 'Switch to day view' : 'Switch to section view'"
            >
                <span class="view-mode-icon" :class="$store.tracker.viewMode === 'sections' ? 'calendar' : 'sections'" aria-hidden="true"></span>
            </button>
        </div>

        <div class="titlebar-center" aria-hidden="true">
            <span class="titlebar-label">OBJECTIVE TRACKER</span>
        </div>

        <div class="window-controls" aria-label="Window controls">
            <button class="window-control minimize" @click="window.objectiveTracker?.minimizeWindow?.()" title="Minimize window" aria-label="Minimize window">—</button>
            <button class="window-control maximize" @click="window.objectiveTracker?.toggleFullScreen?.()" title="Toggle full screen" aria-label="Toggle full screen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="16" rx="1" />
                </svg>
            </button>
            <button class="window-control close" @click="window.objectiveTracker?.closeWindow?.()" title="Close window" aria-label="Close window">✕</button>
        </div>
    </nav>

    <div class="sections-list" x-show="$store.tracker.viewMode === 'sections'">
        <section x-show="$store.tracker.sections.length === 0" class="empty-state flex column align-center">
            <p>No sections yet.</p>
            <button @click="$store.tracker.addSection()">+ Add your first section</button>
        </section>

        <template x-for="section in $store.tracker.sections" :key="section.id">
            <section class="section" x-data="{ get prog() { return $store.tracker.progress(section) } }">
                <div class="section-header flex align-center">
                    <input class="section-title uppercase" x-model="section.title" @input="$store.tracker.save()" placeholder="Section name…" />
                    <button class="icon-btn collapse-btn" x-show="section.tasks.length > 0" @click="$store.tracker.toggleSectionMinimized(section)" :title="section.minimized ? 'Expand section' : 'Minimize section'" :aria-label="section.minimized ? 'Expand section' : 'Minimize section'" :aria-expanded="!section.minimized"></button>
                    <button class="icon-btn danger" @click="$store.tracker.deleteSection(section)">✕</button>
                </div>

                <div class="progress-wrap flex align-center">
                    <div class="progress-track">
                        <div class="progress-fill" :style="{ width: prog.pct + '%' }"></div>
                    </div>
                    <span class="progress-label" x-text="prog.total === 0 ? 'No tasks' : prog.done + ' / ' + prog.total"></span>
                </div>

                <ul class="task-list" x-show="!section.minimized">
                    <template x-for="task in $store.tracker.tasksForSection(section)" :key="task.id">
                        <li
                            class="task"
                            :class="{ 'due-today': $store.tracker.isDueToday(task.deadlineDate), 'overdue-task': $store.tracker.isOverdueTask(task), 'overdue-start': $store.tracker.isFirstOverdueTask(section, task) }"
                        >
                            <div class="task-row flex align-center">
                                <input type="checkbox" :checked="$store.tracker.isTaskChecked(task)" @change="$store.tracker.toggleTask(task)" />
                                <input
                                    class="task-text"
                                    placeholder="Task…"
                                    x-model="task.text"
                                    @input="$store.tracker.save(); task.text = task.text.charAt(0).toUpperCase() + task.text.slice(1)"
                                    :class="{ checked: $store.tracker.isTaskChecked(task) }"
                                    @keydown.enter.prevent="$store.tracker.addSubtask(task)"
                                />
                                <div class="task-deadline-wrap">
                                    <button
                                        type="button"
                                        class="task-deadline-trigger"
                                        @click="$store.tracker.toggleDeadlineEditor(task)"
                                        x-text="$store.tracker.formatDeadline(task)"
                                    >No deadline</button>

                                    <div
                                        class="task-deadline-popover"
                                        x-show="task.deadlineEditorOpen"
                                        x-cloak
                                        @click.outside="task.deadlineEditorOpen = false"
                                    >
                                        <div class="task-deadline-grid">
                                            <input class="task-deadline-field deadline-date-input" x-model="task.deadlineDateInput" @keydown.enter.prevent="$store.tracker.saveDeadline(task)" placeholder="MM/DD/YYYY" maxlength="10" inputmode="numeric" aria-label="Deadline date" />
                                            <input class="task-deadline-field" x-model="task.deadlineTimeInput" @keydown.enter.prevent="$store.tracker.saveDeadline(task)" placeholder="h:mm" maxlength="5" inputmode="numeric" aria-label="Deadline time" />
                                            <div class="deadline-period-toggle" role="group" aria-label="AM or PM">
                                                <button type="button" :class="{ active: task.deadlinePeriod === 'AM' }" @click="task.deadlinePeriod = 'AM'">AM</button>
                                                <button type="button" :class="{ active: task.deadlinePeriod === 'PM' }" @click="task.deadlinePeriod = 'PM'">PM</button>
                                            </div>
                                        </div>
                                        <p class="task-deadline-error" x-show="task.deadlineError" x-text="task.deadlineError"></p>
                                        <div class="task-deadline-actions">
                                            <button type="button" class="task-deadline-clear" @click="$store.tracker.clearDeadline(task)">Clear</button>
                                            <button type="button" class="task-deadline-save" @click="$store.tracker.saveDeadline(task)">Save</button>
                                        </div>
                                    </div>
                                </div>
                                <button class="icon-btn collapse-btn" :class="{ 'collapse-btn-placeholder': task.subtasks.length === 0 }" :disabled="task.subtasks.length === 0" :aria-hidden="task.subtasks.length === 0" @click="$store.tracker.toggleTaskMinimized(task)" :title="task.minimized ? 'Expand task' : 'Minimize task'" :aria-label="task.minimized ? 'Expand task' : 'Minimize task'" :aria-expanded="!task.minimized"></button>
                                <button class="icon-btn" @click="$store.tracker.addSubtask(task)">⤷</button>
                                <button class="icon-btn danger" @click="$store.tracker.deleteTask(section, task)">✕</button>
                            </div>

                            <ul class="subtask-list" x-show="!task.minimized && task.subtasks.length > 0">
                                <template x-for="sub in task.subtasks" :key="sub.id">
                                    <li
                                        class="task-row subtask-row flex align-center"
                                        :data-task-id="task.id"
                                        :data-subtask-id="sub.id"
                                        data-source="section"
                                    >
                                        <button class="drag-handle" type="button" aria-label="Drag to reorder">⋮⋮</button>
                                        <input type="checkbox" :checked="sub.checked" @change="$store.tracker.toggleSubtask(task, sub)" />
                                        <input
                                            class="task-text subtask-text"
                                            x-model="sub.text"
                                            placeholder="Sub-task…"
                                            @input="$store.tracker.save(); sub.text = sub.text.charAt(0).toUpperCase() + sub.text.slice(1)"
                                            :class="{ checked: sub.checked }"
                                        />
                                        <button class="icon-btn danger" @click="$store.tracker.deleteSubtask(task, sub)">✕</button>
                                    </li>
                                </template>
                            </ul>
                        </li>
                    </template>
                </ul>
                <button class="add-btn small" x-show="!section.minimized" @click="$store.tracker.addTask(section)">+ Add task</button>
            </section>
        </template>
    </div>

    <main class="day-view" x-show="$store.tracker.viewMode === 'days'">
        <div class="day-month-row">
            <label class="day-month-label" for="day-month-year">Month / year</label>
            <input
                id="day-month-year"
                class="day-month-input"
                type="text"
                inputmode="numeric"
                maxlength="7"
                placeholder="MM/YYYY"
                :value="$store.tracker.monthYearInput"
                @input="$store.tracker.setMonthYear($event.target.value)"
                @blur="$store.tracker.normalizeMonthYearInput()"
                aria-label="Choose month and year"
            />
        </div>

        <div class="day-date-navigation">
            <button class="day-nav-btn" type="button" @click="$store.tracker.shiftDayWeek(-7)" aria-label="Previous week">‹</button>
            <div class="day-date-strip" role="group" aria-label="Choose a day">
                <template x-for="day in $store.tracker.visibleDays()" :key="day.key">
                    <button class="day-date" type="button" :class="{ 'selected': day.key === $store.tracker.selectedDay }" :aria-pressed="day.key === $store.tracker.selectedDay" @click="$store.tracker.selectDay(day.key)">
                        <span x-text="day.weekday"></span>
                        <strong x-text="day.number"></strong>
                    </button>
                </template>
            </div>
            <button class="day-nav-btn" type="button" @click="$store.tracker.shiftDayWeek(7)" aria-label="Next week">›</button>
        </div>

        <div class="day-summary">
            <strong x-text="$store.tracker.selectedDayLabel()"></strong>
            <span x-text="$store.tracker.dayProgress().total ? `${$store.tracker.dayProgress().total} tasks · ${$store.tracker.dayProgress().done} done` : 'No tasks'"></span>
        </div>

        <ul class="task-list day-task-list">
            <template x-for="entry in $store.tracker.dayViewEntries()" :key="entry.key">
                <li class="task" :class="{ 'overdue-task': $store.tracker.isDayViewEntryOverdue(entry), 'overdue-start': $store.tracker.isFirstOverdueDayEntry(entry) }">
                    <div class="task-row flex align-center">
                        <input type="checkbox" :checked="$store.tracker.isDayViewTaskChecked(entry)" @change="$store.tracker.toggleDayViewTask(entry)" />
                        <input
                            class="task-text"
                            placeholder="Task…"
                            x-model="entry.task.text"
                            @input="$store.tracker.updateDayViewTaskText(entry)"
                            :class="{ checked: $store.tracker.isDayViewTaskChecked(entry) }"
                            @keydown.enter.prevent="$store.tracker.addDayViewSubtask(entry)"
                        />
                        <div class="task-deadline-wrap">
                            <button
                                type="button"
                                class="task-deadline-trigger"
                                @click="$store.tracker.toggleDayViewDeadlineEditor(entry)"
                                x-text="$store.tracker.formatDayTime(entry.task)"
                            >No time</button>
                            <div
                                class="task-deadline-popover"
                                x-show="entry.task.deadlineEditorOpen"
                                x-cloak
                                @click.outside="entry.task.deadlineEditorOpen = false"
                            >
                                <div class="task-deadline-grid day-time-deadline-grid">
                                    <input class="task-deadline-field" x-model="entry.task.deadlineTimeInput" @keydown.enter.prevent="$store.tracker.saveDayViewDeadline(entry)" placeholder="h:mm" maxlength="5" inputmode="numeric" aria-label="Deadline time" />
                                    <div class="deadline-period-toggle" role="group" aria-label="AM or PM">
                                        <button type="button" :class="{ active: entry.task.deadlinePeriod === 'AM' }" @click="entry.task.deadlinePeriod = 'AM'">AM</button>
                                        <button type="button" :class="{ active: entry.task.deadlinePeriod === 'PM' }" @click="entry.task.deadlinePeriod = 'PM'">PM</button>
                                    </div>
                                </div>
                                <p class="task-deadline-error" x-show="entry.task.deadlineError" x-text="entry.task.deadlineError"></p>
                                <div class="task-deadline-actions">
                                    <button type="button" class="task-deadline-clear" @click="$store.tracker.clearDayTimeDeadline(entry)">Clear time</button>
                                    <button type="button" class="task-deadline-save" @click="$store.tracker.saveDayViewDeadline(entry)">Save</button>
                                </div>
                            </div>
                        </div>
                        <button class="icon-btn collapse-btn" :class="{ 'collapse-btn-placeholder': entry.task.subtasks.length === 0 }" :disabled="entry.task.subtasks.length === 0" :aria-hidden="entry.task.subtasks.length === 0" @click="$store.tracker.toggleDayViewTaskMinimized(entry)" :title="entry.task.minimized ? 'Expand task' : 'Minimize task'" :aria-label="entry.task.minimized ? 'Expand task' : 'Minimize task'" :aria-expanded="!entry.task.minimized"></button>
                        <button class="icon-btn" @click="$store.tracker.addDayViewSubtask(entry)" aria-label="Add subtask">⤷</button>
                        <button class="icon-btn danger" @click="$store.tracker.deleteDayViewTask(entry)" aria-label="Delete task">✕</button>
                    </div>
                    <ul class="subtask-list" x-show="!entry.task.minimized && entry.task.subtasks.length > 0">
                        <template x-for="sub in entry.task.subtasks" :key="sub.id">
                            <li class="task-row subtask-row flex align-center" :data-task-id="entry.task.id" :data-subtask-id="sub.id" :data-source="entry.source">
                                <button class="drag-handle" type="button" aria-label="Drag to reorder">⋮⋮</button>
                                <input type="checkbox" :checked="sub.checked" @change="$store.tracker.toggleDayViewSubtask(entry, sub)" />
                                <input
                                    class="task-text subtask-text"
                                    x-model="sub.text"
                                    placeholder="Sub-task…"
                                    @input="$store.tracker.updateDayViewSubtaskText(entry, sub)"
                                    :class="{ checked: sub.checked }"
                                />
                                <button class="icon-btn danger" @click="$store.tracker.deleteDayViewSubtask(entry, sub)" aria-label="Delete subtask">✕</button>
                            </li>
                        </template>
                    </ul>
                </li>
            </template>
        </ul>
        <p class="day-empty" x-show="$store.tracker.dayViewEntries().length === 0">No tasks for this day.</p>
        <div class="day-add-controls">
            <select id="day-section-select" class="day-section-select" x-model="$store.tracker.newDayTaskSectionId" aria-label="Section for new task (required)" required>
                <option value="" disabled>Choose section…</option>
                <template x-for="section in $store.tracker.sections" :key="section.id">
                    <option :value="section.id" x-text="section.title ? section.title.charAt(0).toUpperCase() + section.title.slice(1) : 'Untitled section'"></option>
                </template>
            </select>
            <button class="add-btn small day-add-btn" @click="$store.tracker.addFromToolbar()" :aria-disabled="!$store.tracker.canAddDayTask()" :title="$store.tracker.canAddDayTask() ? '' : 'Choose a section before adding a task'">
                Add a task for <span x-text="$store.tracker.selectedWeekday()"></span>
            </button>
        </div>
    </main>
    <div id="app-hover-tooltip" aria-hidden="true"></div>
</div>
</body>
</html>
